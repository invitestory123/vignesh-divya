    <style>

      }

      .hero-couple-name {

      @media (min-width: 768px) {

      @media (max-width: 640px) {

        img.animate-float {
          max-height: 28vh !important;
          width: auto !important;
          max-width: 220px !important;
          object-fit: contain !important;
          margin-top: 4px !important;
        }

        .pointer-events-none.absolute.-bottom-3.-left-4,
        .pointer-events-none.absolute.-bottom-3.-right-4 {
          width: 96px !important;
          opacity: 0.85;
        }
      }

      /* Floating BGM Toggle Button */
      #bgmAudioBtn {
        position: fixed;
        bottom: max(20px, env(safe-area-inset-bottom, 20px));
        right: 20px;
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: linear-gradient(135deg, #8f1d3a 0%, #57102a 100%);
        border: 2px solid #e8a93c;
        box-shadow: 0 4px 18px rgba(87, 16, 42, 0.45), 0 0 12px rgba(232, 169, 60, 0.35);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 9999;
        transition: transform 0.25s ease, box-shadow 0.25s ease;
        -webkit-tap-highlight-color: transparent;
      }
      #bgmAudioBtn:hover {
        transform: scale(1.08);
        box-shadow: 0 6px 22px rgba(87, 16, 42, 0.55), 0 0 16px rgba(232, 169, 60, 0.55);
      }
      #bgmAudioBtn:active {
        transform: scale(0.94);
      }
      #bgmAudioBtn svg {
        width: 22px;
        height: 22px;
        fill: #FFF9EF;
      }
      #bgmAudioBtn.bgm-playing #bgmIconPlay {
        animation: bgmDiskSpin 6s linear infinite;
      }
      @keyframes bgmDiskSpin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- Background Music Audio -->
    <audio id="weddingBgAudio" loop preload="auto" playsinline>
      <source src="./editable/assets/bgm.mp3" type="audio/mpeg" />
    </audio>

    <!-- Floating Audio Toggle Button -->
    <button
      id="bgmAudioBtn"
      type="button"
      aria-label="Play background music"
      aria-pressed="false"
      title="Toggle background music"
    >
      <svg id="bgmIconPlay" style="display:none" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
      </svg>
      <svg id="bgmIconMuted" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M4.27 3L3 4.27l9 9v.28c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4v-1.73l4.73 4.73c-.45.34-.98.59-1.57.73l.63 1.9c.89-.22 1.7-.62 2.39-1.15L19.73 21 21 19.73 4.27 3zM14 7h4V3h-6v5.18l2 2V7z"/>
      </svg>
    </button>

    <script>
      (function () {
        var audio = document.getElementById("weddingBgAudio");
        var btn = document.getElementById("bgmAudioBtn");
        var iconPlay = document.getElementById("bgmIconPlay");
        var iconMuted = document.getElementById("bgmIconMuted");
        var hasUserInteracted = false;

        if (!audio || !btn) return;

        var bgmConfig = (window.WEDDING_DATA && window.WEDDING_DATA.bgm) || {};
        if (bgmConfig.src) {
          audio.src = bgmConfig.src;
        }
        if (typeof bgmConfig.volume === "number" && bgmConfig.volume >= 0 && bgmConfig.volume <= 1) {
          audio.volume = bgmConfig.volume;
        } else {
          audio.volume = 0.65;
        }
        if (bgmConfig.title) {
          btn.title = "Background music: " + bgmConfig.title;
        }

        function updateUI(isPlaying) {
          iconPlay.style.display = isPlaying ? "block" : "none";
          iconMuted.style.display = isPlaying ? "none" : "block";
          btn.classList.toggle("bgm-playing", isPlaying);
          btn.setAttribute("aria-pressed", isPlaying ? "true" : "false");
          btn.setAttribute("aria-label", isPlaying ? "Pause background music" : "Play background music");
        }

        function playMusic() {
          audio.muted = false;
          var promise = audio.play();
          if (promise !== undefined) {
            promise
              .then(function () {
                updateUI(true);
              })
              .catch(function () {
                updateUI(false);
              });
          } else {
            updateUI(!audio.paused);
          }
        }

        function pauseMusic() {
          audio.pause();
          updateUI(false);
        }

        function cleanupUnlockListeners() {
          window.removeEventListener("click", unlockAudio, true);
          window.removeEventListener("touchstart", unlockAudio, true);
          window.removeEventListener("keydown", unlockAudio, true);
        }

        function unlockAudio(e) {
          if (hasUserInteracted) return;
          hasUserInteracted = true;
          cleanupUnlockListeners();
          if (e && e.target && btn.contains(e.target)) {
            return;
          }
          if (audio.paused) {
            playMusic();
          }
        }

        btn.addEventListener("click", function (e) {
          e.stopPropagation();
          hasUserInteracted = true;
          cleanupUnlockListeners();
          if (audio.paused) {
            playMusic();
          } else {
            pauseMusic();
          }
        });

        audio.addEventListener("play", function () {
          updateUI(true);
        });
        audio.addEventListener("pause", function () {
          updateUI(false);
        });

        window.addEventListener("click", unlockAudio, true);
        window.addEventListener("touchstart", unlockAudio, true);
        window.addEventListener("keydown", unlockAudio, true);

        playMusic();
      })();
    </script>
  </body>
